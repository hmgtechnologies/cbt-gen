<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CBT Generator Validator</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:900px;margin:0 auto;padding:32px}.result{padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin:10px 0}.ok{color:var(--primary)}.bad{color:var(--danger)}.warn{color:var(--warning)}</style></head>
<body><div class="wrap"><a href="index.html" class="btn ghost">← Back</a><h1>CBT Generator Validator</h1><p class="lead">Checks whether the generator can read its template files and whether the bundled CBT template contains the expected v3.1 security functions.</p><button class="btn primary" onclick="runChecks()">Run Checks</button><div id="out"></div></div><script>
const ROOT='templates/hmg-cbt-pro-v3.1/';
function row(kind,title,msg){return `<div class="result"><b class="${kind}">${kind==='ok'?'✅':kind==='warn'?'⚠️':'❌'} ${title}</b><div>${msg||''}</div></div>`}
async function text(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path+' HTTP '+r.status);return await r.text()}
async function exists(path){try{const r=await fetch(path,{cache:'no-store'});return r.ok}catch(e){return false}}
async function runChecks(){const out=document.getElementById('out');out.innerHTML=row('warn','Running','Please wait...');let html='';try{const m=JSON.parse(await text('template-manifest.json'));html+=row('ok','Manifest loaded',m.files.length+' template files listed.');let found=0;for(const f of m.files){if(f==='.nojekyll'||await exists(ROOT+f))found++;}html+=row(found===m.files.length?'ok':'bad','Template reachability',found+'/'+m.files.length+' files reachable.');const sql=await text(ROOT+'COMPLETE_SQL_SETUP.sql');html+=row(sql.includes('is_platform_admin')&&sql.includes('get_public_exam_by_code')&&sql.includes('verify_student_for_exam')&&sql.includes('get_exam_attempt_count')?'ok':'bad','v3.1 SQL security functions','Admin guard and public student RPCs detected.');const gen=await text('generator.js');html+=row(!gen.includes('service_role')?'ok':'warn','No service_role literal in generator','Generator warns about service_role but does not require it.');html+=row(gen.includes('createZip')?'ok':'bad','Browser ZIP engine','Internal ZIP writer detected.');}catch(e){html+=row('bad','Validator failed',e.message)}out.innerHTML=html}
runChecks();
</script></body></html>
